name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib || echo "::warning::Formatting drift — run 'dart format lib'"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Download aria2 for engine e2e test
        run: |
          curl -sL -o aria2.zip https://github.com/abcfy2/aria2-static-build/releases/download/1.37.0/aria2-x86_64-linux-musl_static.zip
          unzip -o aria2.zip
          chmod +x aria2c
          echo "POPCORN_ARIA2=$(pwd)/aria2c" >> "$GITHUB_ENV"

      - name: Run tests (unit + engine e2e)
        run: flutter test
